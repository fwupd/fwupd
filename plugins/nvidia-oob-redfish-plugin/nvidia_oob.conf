#
# Galaxy GB300 - LVFS OOB Redfish plugin configuration
#
# this file is optional; when present, its values override the
# defaults compiled into the plugin; all keys are string-typed
# and take effect at fwupd daemon startup (restart fwupd after
# editing)
#
# install-plugin.sh writes the live copy of this file to
# /etc/fwupd/nvidia_oob.conf with permissions 600 (root-only)

[OOB]
# BMC Redfish base address; the DGX Station GB300 BMC is always reachable
# at 10.0.1.1 over the USB CDC/RNDIS virtual NIC the netplan config at
# /etc/netplan/10-nvidia-oob-bmc.yaml brings up; override only if the
# subnet or addressing scheme changes
BmcHost = 10.0.1.1

# BMC login username; defaults to "root" if unset; used by
# fwupd-nvidia-oob-env.sh as the default username when prompting interactively
BmcUser = root

# BMC password is intentionally NOT stored in this file;
# run 'sudo nvidia-oob-auth.sh' to authenticate -- it prompts for credentials
# interactively, creates a Redfish session, and writes only the resulting
# session token to /run/fwupd/nvidia_oob.session (tmpfs, cleared on reboot)

# PEM-encoded CA bundle used to verify the BMC TLS certificate;
# defaults to /etc/fwupd/pki/nvidia-oob/ca.pem
#CaPath = /etc/fwupd/pki/nvidia-oob/ca.pem

# maximum time (seconds) to poll a Redfish Task before giving up;
# the default is 3600 (1 hour), which covers BMC + SBIOS + PLDM
# bundle flash sequences on the GB300 reference platform
#TaskTimeout = 3600

on: workflow_call

permissions:
  contents: read

jobs:
  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480 # v1.5.6
        env:
          CC: gcc
        with:
          usesh: true
          mem: 8192
          sync: rsync
          envs: "CI CC"
          prepare: |
            pkg install -y bash python3 git ninja cmake gcc
          run: |
            ./contrib/ci/fwupd_setup_helpers.py install-dependencies -o freebsd --yes
            ./contrib/setup
            bash -c "source ./venv/bin/activate && build-fwupd"

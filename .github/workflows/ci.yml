name: CI
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    permissions:
      security-events: write
    if: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1

  pre-commit:
    permissions:
      contents: read
    needs: zizmor
    if: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      SKIP: no-commit-to-branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pre-commit
        run: |
          sudo apt-get update -qq
          sudo add-apt-repository -y ppa:peter-hutterer/meson1.11; \
          sudo apt-get install -qq --yes --no-install-recommends \
            clang-format \
            git \
            meson \
            patch \
            pre-commit \
            python3-lxml \
            shellcheck \
            shfmt
      - name: Run pre-commit hooks
        run: pre-commit run -v --show-diff-on-failure --hook-stage commit --all-files

  containers:
    permissions:
      contents: read
      packages: write
    needs: pre-commit
    if: ${{ always() && (needs.pre-commit.result == 'success' || needs.pre-commit.result == 'skipped') }}
    uses: $/.github/workflows/create_containers.yml

  android:
    permissions:
      contents: read
    needs: [pre-commit, containers]
    if: ${{ always() && (needs.pre-commit.result == 'success' || needs.pre-commit.result == 'skipped') && needs.containers.result == 'success' }}
    uses: $/.github/workflows/android.yml
    with:
      container_lut: ${{ needs.containers.outputs.container_lut }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  bsd:
    permissions:
      contents: read
    needs: pre-commit
    if: ${{ always() && (needs.pre-commit.result == 'success' || needs.pre-commit.result == 'skipped') }}
    uses: $/.github/workflows/bsd.yml

  linux:
    permissions:
      contents: read
    needs: [pre-commit, containers]
    if: ${{ always() && (needs.pre-commit.result == 'success' || needs.pre-commit.result == 'skipped') && needs.containers.result == 'success' }}
    uses: $/.github/workflows/linux.yml
    with:
      publish: false
      container_lut: ${{ needs.containers.outputs.container_lut }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  macos:
    permissions:
      contents: read
    needs: pre-commit
    if: ${{ always() && (needs.pre-commit.result == 'success' || needs.pre-commit.result == 'skipped') }}
    uses: $/.github/workflows/macos.yml

  openbmc:
    permissions:
      contents: read
    needs: [pre-commit, containers]
    if: ${{ always() && (needs.pre-commit.result == 'success' || needs.pre-commit.result == 'skipped')  && needs.containers.result == 'success' }}
    uses: $/.github/workflows/openbmc.yml
    with:
      container_lut: ${{ needs.containers.outputs.container_lut }}

  snap:
    permissions:
      contents: read
    needs: pre-commit
    if: ${{ always() && (needs.pre-commit.result == 'success' || needs.pre-commit.result == 'skipped') }}
    uses: $/.github/workflows/snap.yml
    with:
      deploy: ${{ github.ref == 'refs/heads/main' }}
    secrets:
      STORE_LOGIN: ${{ secrets.STORE_LOGIN }}

  static-analysis:
    permissions:
      contents: read
    needs: pre-commit
    if: ${{ always() && (needs.pre-commit.result == 'success' || needs.pre-commit.result == 'skipped') }}
    uses: $/.github/workflows/static-analysis.yml

  windows:
    permissions:
      contents: write
    needs: pre-commit
    if: ${{ always() && (needs.pre-commit.result == 'success' || needs.pre-commit.result == 'skipped') }}
    uses: $/.github/workflows/windows.yml
    with:
      publish: false

  fuzzing:
    permissions:
      security-events: write
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Build Fuzzers
        id: build
        uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@32f1d4deadc82279ec9001a837f2424e185c69a2 # master
        with:
          oss-fuzz-project-name: "fwupd"
          output-sarif: true
      - name: Run Fuzzers
        uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@32f1d4deadc82279ec9001a837f2424e185c69a2 # master
        with:
          fuzz-seconds: 600
          oss-fuzz-project-name: "fwupd"
          output-sarif: true
      - name: Upload Crash
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.build.outcome == 'success'
        with:
          name: artifacts
          path: ./out/artifacts
      - name: Upload Sarif
        if: always() && steps.build.outcome == 'success'
        uses: github/codeql-action/upload-sarif@e58424170fb0262c8d7ed60a2e84b9bffe205c67 # codeql-bundle-v2.26.1
        with:
          # Path to SARIF file relative to the root of the repository
          sarif_file: cifuzz-sarif/results.sarif
          checkout_path: cifuzz-sarif

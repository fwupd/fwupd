name: Snap workflow
on:
  workflow_call:
    inputs:
      deploy:
        required: true
        type: boolean
      container_lut:
        required: true
        type: string
    secrets:
      STORE_LOGIN:
        required: true

permissions:
  contents: read

env:
  CARGO_HOME: "${{ github.workspace }}/cargo-home"

jobs:
  build-snap:
    runs-on: ubuntu-latest
    outputs:
      snap_name: ${{ steps.snapcraft.outputs.snap }}
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: channel
        run: |
          if git describe --exact-match; then
            echo "channel=candidate" >>"$GITHUB_OUTPUT"
          else
            echo "channel=edge" >>"$GITHUB_OUTPUT"
          fi
      - run: |
          mkdir -p snap
          ln -s ../contrib/snap/snapcraft.yaml snap/snapcraft.yaml
      - run: |
          mkdir -p parts stage prime "$RUNNER_TEMP/craft-cache/pip" "$CARGO_HOME"
          sudo chown root:root "$RUNNER_TEMP/craft-cache" "$RUNNER_TEMP/craft-cache/pip" "$CARGO_HOME"
          sudo chmod 0777 "$RUNNER_TEMP/craft-cache" "$RUNNER_TEMP/craft-cache/pip" "$CARGO_HOME"
      - name: Find Snap build container
        id: find_container
        uses: ./.github/actions/find-container # zizmor: ignore[self-repository]
        with:
          distro: ubuntu
          arch: amd64
          variant: snap
          container_lut: ${{ inputs.container_lut }}
      - name: Restore Snap build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/craft-cache
            ${{ github.workspace }}/cargo-home
            parts
            stage
            prime
          key: snapcraft-${{ hashFiles('contrib/snap/snapcraft.yaml', 'contrib/snap/**', 'contrib/ci/Dockerfile-ubuntu-snap.in', 'contrib/ci/dependencies.xml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: snapcraft-${{ hashFiles('contrib/snap/snapcraft.yaml', 'contrib/snap/**', 'contrib/ci/Dockerfile-ubuntu-snap.in', 'contrib/ci/dependencies.xml') }}-
      - name: Build snap
        id: snapcraft
        env:
          CONTAINER_URI: ${{ steps.find_container.outputs.container_uri }}
        run: |
          docker run --rm -t \
              -e "CI=$CI" \
              -e "CARGO_HOME=/github/workspace/cargo-home" \
              -e SNAPCRAFT_BUILD_ENVIRONMENT=host \
              -e SNAPCRAFT_BUILD_INFO=1 \
              -e "SNAPCRAFT_IMAGE_INFO={\"build_url\":\"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" \
              -v "$GITHUB_WORKSPACE:/github/workspace" \
              -v "$RUNNER_TEMP/craft-cache:/root/.cache" \
              "${CONTAINER_URI}" \
              ./contrib/ci/ubuntu-snap-build.sh
          snap_name="$(find . -maxdepth 1 -type f -name '*.snap' -printf '%f\n' -quit)"
          test -n "$snap_name"
          echo "snap=$snap_name" >> "$GITHUB_OUTPUT"
      - name: Save Snap build cache
        if: ${{ success() && github.event_name == 'push' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/craft-cache
            ${{ github.workspace }}/cargo-home
            parts
            stage
            prime
          key: snapcraft-${{ hashFiles('contrib/snap/snapcraft.yaml', 'contrib/snap/**', 'contrib/ci/Dockerfile-ubuntu-snap.in', 'contrib/ci/dependencies.xml') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snap
          path: ${{ steps.snapcraft.outputs.snap }}

  test-snap:
    needs: build-snap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snap
      - env:
          SNAP_NAME: ${{ needs.build-snap.outputs.snap_name }}
        run: |
          sudo apt remove fwupd -y
          sudo snap install --dangerous "$SNAP_NAME"
          sudo snap connect fwupd:polkit :polkit
          sudo fwupd.fwupdtool enable-test-devices
      - name: Set up snap specific environment
        run: |
          # location which can be used as TMPDIR and is accessible from both snap
          # sandbox and from the host
          SNAP_TEST_TMPDIR=/var/snap/fwupd/common/fwupd-tests
          sudo mkdir -p "$SNAP_TEST_TMPDIR"
          echo "SNAP_TEST_TMPDIR=$SNAP_TEST_TMPDIR" >> "$GITHUB_ENV"
      - name: Run fwupdmgr tests
        run: |
          sudo TMPDIR="$SNAP_TEST_TMPDIR" \
              /snap/fwupd/current/share/installed-tests/fwupd/fwupdmgr.sh
      - name: Run fwupd tests
        run: |
          sudo TMPDIR="$SNAP_TEST_TMPDIR" \
              /snap/fwupd/current/share/installed-tests/fwupd/fwupd.sh
      - name: Run fwupdtool tests
        run: |
          sudo TMPDIR="$SNAP_TEST_TMPDIR" \
              /snap/fwupd/current/share/installed-tests/fwupd/fwupdtool.sh
      - name: Run fwupdtool efiboot specific tests
        run: |
          sudo TMPDIR="$SNAP_TEST_TMPDIR" \
              /snap/fwupd/current/share/installed-tests/fwupd/fwupdtool-efiboot.sh
      - name: Test fwupdtui can start
        run: |
          # Check that fwupdtui starts without import errors
          # --help is non-interactive and should exit 0
          sudo snap run fwupd.fwupdtui --help 2>&1

  deploy-store:
    needs: [build-snap, test-snap]
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snap
      - uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
        with:
          snap: ${{ needs.build-snap.outputs.snap_name }}
          release: ${{ needs.build-snap.outputs.channel }}

name: Publish

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  linux:
    permissions:
      contents: read
    uses: ./.github/workflows/linux.yml
    with:
      publish: true
    secrets: inherit

  windows:
    permissions:
      contents: write
    uses: ./.github/workflows/windows.yml
    with:
      publish: true
    secrets: inherit

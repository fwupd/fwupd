# This is more of an approximation for the sensible set of build options for openbmc but still
# hosted on just plain ubuntu.

on:
  workflow_call:
    inputs:
      container_lut:
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHONWARNINGS: "ignore::DeprecationWarning:gi.events"

jobs:
  find-container:
    runs-on: ubuntu-latest
    outputs:
      container_uri: ${{ steps.find_container.outputs.container_uri }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Find container image
        id: find_container
        uses: ./.github/actions/find-container
        with:
          distro: ubuntu
          arch: amd64
          container_lut: ${{ inputs.container_lut }}

  build:
    runs-on: ubuntu-latest
    needs: find-container
    container:
      image: ${{ needs.find-container.outputs.container_uri }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install dependencies
        run: |
          sudo ./contrib/ci/fwupd_setup_helpers.py install-dependencies -o ubuntu --yes
          sudo ./contrib/ci/fwupd_setup_helpers.py test-meson
      - name: build
        run: |
          ./contrib/build-openbmc.sh --prefix=/home/runner/.root

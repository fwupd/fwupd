# This is more of an approximation for the sensible set of build options for openbmc but still
# hosted on just plain ubuntu.

on:
  workflow_call:
    inputs:
      container_lut:
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHONWARNINGS: "ignore::DeprecationWarning:gi.events"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ${{ fromJSON(inputs.container_lut)['ubuntu-amd64'] }} # zizmor: ignore[self-repository]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build
        run: |
          ./contrib/build-openbmc.sh --prefix=/home/runner/.root

on:
  workflow_call:
    inputs:
      ubuntu-image:
        required: true
        type: string
      debian-image:
        required: true
        type: string

permissions:
  contents: read

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.ubuntu-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |-
          apt-get update -qq
          apt-get install -qq --yes --no-install-recommends clang-tidy
      - name: ensure up-to-date dependencies are installed
        run: |-
          ./contrib/ci/fwupd_setup_helpers.py install-dependencies -o ubuntu --yes
      - name: configure
        run: |-
          meson setup -Dwerror=true build
      - name: build
        run: |-
          ninja -C build
      - name: clang-tidy
        run: |-
          ninja -C build clang-tidy

  gcc:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.debian-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ensure up-to-date dependencies are installed
        run: |-
          ./contrib/ci/fwupd_setup_helpers.py install-dependencies -o debian --yes
      - name: configure
        run: |-
          meson setup -Dwerror=true -Dstatic_analysis=true build
      - name: build with `-fanalyzer`
        run: |-
          ninja -C build

  gobject-linter:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bilelmoussaoui/gobject-linter:latest # zizmor: ignore[unpinned-images]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: run gobject-linter
        run: gobject-linter

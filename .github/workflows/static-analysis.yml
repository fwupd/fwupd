on:
  workflow_call:
    inputs:
      container_lut:
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHONWARNINGS: "ignore::DeprecationWarning:gi.events"

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    container:
      image: ${{ fromJSON(inputs.container_lut)['ubuntu-amd64'] }} # zizmor: ignore[self-repository]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: configure
        run: |-
          meson setup -Dwerror=true build
      - name: build
        run: |-
          ninja -C build
      - name: clang-tidy
        run: |-
          ninja -C build clang-tidy

  gcc:
    runs-on: ubuntu-latest
    container:
      image: ${{ fromJSON(inputs.container_lut)['debian-amd64'] }} # zizmor: ignore[unpinned-images]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: configure
        run: |-
          meson setup -Dwerror=true -Dstatic_analysis=true build
      - name: build with `-fanalyzer`
        run: |-
          ninja -C build

  gobject-linter:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bilelmoussaoui/gobject-linter:latest # zizmor: ignore[unpinned-images]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: run gobject-linter
        run: gobject-linter

on:
  workflow_call:
    inputs:
      container_lut:
        required: true
        type: string
    secrets:
      CODECOV_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Find container image
        id: find_container
        uses: ./.github/actions/find-container # zizmor: ignore[self-repository]
        with:
          distro: ubuntu
          arch: amd64
          variant: android
          container_lut: ${{ inputs.container_lut }}
      - name: prepare LVFS firmware cache
        run: mkdir -p "$RUNNER_TEMP/lvfs-firmware-cache"
      - name: restore LVFS firmware cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lvfs-firmware-cache
          key: lvfs-firmware-${{ hashFiles('plugins/**/*test*/*.json') }}
          restore-keys: lvfs-firmware-
      - name: Build in container
        env:
          CI_NETWORK: true
          PYTHONWARNINGS: "ignore::DeprecationWarning:gi.events"
          CONTAINER_URI: "${{ steps.find_container.outputs.container_uri }}"
        run: |
          docker run --privileged -t \
              -e "CI=$CI" \
              -e "CI_NETWORK=$CI_NETWORK" \
              -e "VARIANT=android" \
              -e "PYTHONWARNINGS=$PYTHONWARNINGS" \
              -v "$GITHUB_WORKSPACE:/github/workspace" \
              -v "$RUNNER_TEMP/lvfs-firmware-cache:/root/.cache/fwupd" \
              "${CONTAINER_URI}" \
              ./contrib/ci/ubuntu-android-build.py
      - name: Save Android install tree
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-android
          path: ${{ github.workspace }}/dist-android.tar.gz
          if-no-files-found: error
      - name: Save Android coverage tree
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-tree-android
          path: ${{ github.workspace }}/coverage-tree-android.tar.gz
          if-no-files-found: error
      - name: Save any coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-ubuntu-amd64-android
          path: ${{ github.workspace }}/coverage.xml
          if-no-files-found: ignore
      - name: Upload to codecov
        if: ${{ hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  emulator:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Find container image
        id: find_container
        uses: ./.github/actions/find-container # zizmor: ignore[self-repository]
        with:
          distro: ubuntu
          arch: amd64
          variant: android
          container_lut: ${{ inputs.container_lut }}
      - name: Download Android install tree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-android
      - name: Download Android coverage tree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-tree-android
      - name: Unpack artifacts
        run: |
          mkdir -p dist-android
          tar -xzf dist-android.tar.gz -C dist-android
          tar -xzf coverage-tree-android.tar.gz
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run daemon and fwupdmgr on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          script: ./contrib/ci/ubuntu-android-emulator-test.py --source-root . --builddir ./build --destdir ./dist-android
      - name: Generate on-device coverage report
        if: ${{ !cancelled() }}
        env:
          CONTAINER_URI: "${{ steps.find_container.outputs.container_uri }}"
        run: |
          # merge the .gcda pulled off the device next to the matching .gcno, then
          # run coverage.py inside the android container (NDK llvm-cov + gcovr) with
          # the workspace mounted at /github/workspace so the compile-time paths line up
          gcda_build=$(find emulator-gcov -type d -name build 2>/dev/null | head -1)
          if [ -z "${gcda_build}" ]; then
            echo "no on-device .gcda collected; skipping coverage"
            exit 0
          fi
          cp -a "${gcda_build}/." build/
          rm -rf emulator-gcov/
          rm -rf build/subprojects/
          docker run --rm \
              -e "CI=true" \
              -e "GCOV=/opt/android/android-ndk-r27d/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-cov gcov" \
              -e "GCOVR_SEARCH=build" \
              -e "GCOVR_IGNORE_ERRORS=no_working_dir_found" \
              -v "$GITHUB_WORKSPACE:/github/workspace" \
              -w /github/workspace \
              "${CONTAINER_URI}" \
              ./contrib/ci/coverage.py
      - name: Upload to codecov
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          flags: android-emulator
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

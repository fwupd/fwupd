name: Bug report (Dell WD19)
description: Create a report to help us improve
title: "Dell WD19 upgrade issue"
labels: ["bug"]
assignees: ["cragw"]
body:
  - type: checkboxes
    id: human
    attributes:
      label: Human confirmation
      description: Issues are for people to discuss with people.
      options:
        - label: I am a human filing this issue myself, and it was not generated or submitted by an automated tool or AI agent.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: fwupd version information
      description: |
        Please provide the version of the daemon and client by running the following and pasting the output.
        ```shell
        fwupdtool get-report-metadata
        ```
      render: shell
    validations:
      required: true
  - type: input
    id: install-method
    attributes:
      label: Installation method
      description: How did you install fwupd (`apt`, `dnf`, `pacman`, source, etc)?
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: fwupd device information
      description: |
        Please provide the output of the external fwupd devices recognized in your system.
        ```shell
        fwupdmgr get-devices --filter=~internal
        ```
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: sku
    attributes:
      label: Dock SKU
      description: Please mention which module is installed in your WD19.
      options:
        - label: WD19 (Single-C)
        - label: WD19TB (Thunderbolt)
        - label: WD19DC (Dual-C)
  - type: textarea
    id: peripherals
    attributes:
      label: Peripherals connected to the dock
      description: |
        Please describe all devices connected to the dock. Be as specific as possible,
        including USB devices, hubs, monitors, and downstream type-C devices.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Verbose daemon logs
      description: |
        First enable daemon verbose logs collection.
        ```shell
        fwupdmgr modify-config "VerboseDomains" "*"
        ```
        Then try to reproduce the issue. Even if it doesn't reproduce, please attach the
        daemon verbose logs collected from the system journal.
        ```shell
        journalctl -b -u fwupd.service
        ```
      render: shell
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
    validations:
      required: true
  - type: dropdown
    id: unplugged
    attributes:
      label: Have you tried unplugging the dock or any peripherals from your machine?
      options: ["Yes", "No"]
  - type: dropdown
    id: power-cycled
    attributes:
      label: Have you tried to power cycle the dock from the AC adapter?
      options: ["Yes", "No"]
  - type: dropdown
    id: regression
    attributes:
      label: Is this a regression?
      options: ["Yes", "No", "Not sure"]

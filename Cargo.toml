[workspace]
resolver = "2"
members = [
    "rust/fwupd",
    "rust/fwupd-ffi",
    "rust/cabtool",
]

# Abort instead of trying to unwind through C FFI which is undefined behavior
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[workspace.package]
edition = "2021"
rust-version = "1.75"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unreadable_literal = "allow"
